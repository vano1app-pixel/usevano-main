project_id = "puomfwjtpvqedwxjxogh"

[functions]
  # One-tap accept link tapped by a helper from WhatsApp/SMS/email — no JWT to
  # send. Auth is the HMAC-signed, expiring token in the URL (see accept-job +
  # _shared/acceptToken), verified inside the function.
  [functions.accept-job]
    verify_jwt = false
  # Helper self-service on /student-account: phone-number auth verified inside
  # the function (same model as update-helper-profile / cancel-helper-subscription).
  [functions.disconnect-helper-payouts]
    verify_jwt = false
  [functions.delete-helper-account]
    verify_jwt = false
  # The phone-gated profile READ + SAVE + subscription-cancel. These MUST be
  # false: the account page authenticates with the anon/publishable key (not a
  # user JWT) and proves identity in-code via the account_token. With the new
  # sb_publishable_ keys the gateway rejects a non-JWT bearer as "Invalid JWT"
  # when verify_jwt is true, so an unpinned function (which defaults to true)
  # silently 401s every save the moment the project migrates off the legacy
  # anon key. Auth for all three lives inside the function.
  [functions.find-helper-by-phone]
    verify_jwt = false
  [functions.update-helper-profile]
    verify_jwt = false
  [functions.cancel-helper-subscription]
    verify_jwt = false
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.stripe-webhook]
    verify_jwt = false
  [functions.create-household-payment-checkout]
    verify_jwt = false
  # "Name any job" AI brain: reads the CustomJobBuilder free-text box (Gemini)
  # to suggest a job + duration + timing. Public, pre-auth, anonymous customers;
  # fail-soft (never blocks). Uses GEMINI_API_KEY like the other ai-* functions.
  [functions.parse-custom-job]
    verify_jwt = false
  # The WhatsApp door: Twilio inbound-message webhook — Twilio can't send a
  # JWT, so auth is the X-Twilio-Signature HMAC verified inside the function
  # (same trust model as stripe-webhook). Books through
  # create-household-payment-checkout; never flip this to true.
  [functions.whatsapp-inbound]
    verify_jwt = false
  # Ring Vano — server tools the ElevenLabs voice agent calls (quote/book/
  # status + the personalization webhook). ElevenLabs can't send a Supabase
  # JWT, so auth is the X-Vano-Secret shared-secret header verified inside the
  # function. Books through create-household-payment-checkout; keep pinned.
  [functions.voice-agent-tools]
    verify_jwt = false
  # Helper signup — no auth account needed, service-role handles photo upload + DB insert.
  [functions.create-helper-application]
    verify_jwt = false
  # Helper verification — student-email OTP + Stripe Identity. The OTP pair and
  # the identity-session creator are called by the (account-less) applicant, so
  # no user JWT; the webhook is authenticated by its Stripe-Signature header.
  [functions.send-student-email-otp]
    verify_jwt = false
  [functions.verify-student-email-otp]
    verify_jwt = false
  # SMS/WhatsApp code — reliable alternative to the email OTP; verified by the
  # same verify-student-email-otp. Applicant has no JWT yet.
  [functions.send-student-sms-otp]
    verify_jwt = false
  # The /student-account SMS gate: texts a code to the number on the helper's
  # own row and mints the account_token the phone-authed functions require.
  # Callers are phone-gated helpers with no JWT; origin + rate limits inside.
  [functions.student-account-otp]
    verify_jwt = false
  [functions.create-identity-verification]
    verify_jwt = false
  [functions.stripe-identity-webhook]
    verify_jwt = false
  # Webhook-independent ID-check backstop polled by the verify page (reads only
  # the helper's own stored session id). Applicant has no JWT yet.
  [functions.check-identity-status]
    verify_jwt = false
  [functions.confirm-signup-payment]
    verify_jwt = false
  [functions.complete-household-job]
    verify_jwt = false
  # Nudges the customer to confirm a finished job (and escalates to an admin if
  # they don't) so a helper isn't left unpaid. Called by the cron and internally
  # by household-arrival; never moves money. No user JWT to verify.
  [functions.remind-confirm-completion]
    verify_jwt = false
  # Best-effort web push to a household customer's browser on each status step.
  # Called server-to-server with the service-role key from the transition
  # functions; never blocks the flow. No user JWT to verify.
  [functions.send-household-push]
    verify_jwt = false

  # Cron sweep for PAID jobs whose helper accepted then ghosted (never marked
  # arrival). Called by the scheduler with the anon/service key; every action is
  # idempotency-stamped and status-guarded. No user JWT. Cadence: */15 * * * *.
  [functions.sweep-stalled-jobs]
    verify_jwt = false

  # Cron that chases helper drop-offs: approved helpers with held earnings but
  # no payout setup, and pending applicants stalled mid-signup. Scheduler /
  # service-key only; capped + stamped per helper. Cadence: 30 * * * *.
  [functions.nudge-helper-onboarding]
    verify_jwt = false

  # Customer "report a problem / money-back" — booking-id gated (same trust
  # model as customer_cancel in cancel-household-booking). Auto-refunds when the
  # helper hasn't been paid yet; escalates to the owner otherwise.
  [functions.report-household-problem]
    verify_jwt = false

  # Cron for book-ahead jobs: dispatches a future-dated booking when it enters
  # its lead window (not days early) and reminds the helper before start.
  # Scheduler / service-key only. Cadence: */5 * * * *.
  [functions.dispatch-scheduled-jobs]
    verify_jwt = false

  # Cron sweep that releases held household-helper payouts once the helper
  # finishes Stripe Connect onboarding. Called by the scheduler with the
  # service key; the per-row status guard + Stripe Idempotency-Key are the
  # real safety net, so we skip JWT verification at the edge. Suggested
  # cadence: */15 * * * *.
  [functions.release-household-payouts]
    verify_jwt = false

  # Partner "you just earned €X" email digests — scheduler-called (hourly),
  # no user JWT; idempotent via referral_commissions.notified_at.
  [functions.notify-partner-commissions]
    verify_jwt = false

  # Admin ledger for the manual 3% partner payouts (list owed / mark paid).
  # Auth lives inside the function: caller JWT → user_roles role='admin'.
  [functions.admin-partner-payouts]
    verify_jwt = false

  # House Autopilot helper matching. dispatch-autopilot-plan is called by
  # stripe-webhook with the service-role key (internal-only check inside);
  # accept-autopilot-plan is the helper's one-tap claim link (HMAC token in the
  # URL, same scheme as accept-job) — neither receives a user JWT.
  [functions.dispatch-autopilot-plan]
    verify_jwt = false
  [functions.accept-autopilot-plan]
    verify_jwt = false

# --- verify_jwt pins (added so the deploy workflow reproduces the exact
# live settings and never flips a function's gateway auth). These were
# previously deployed with verify_jwt=false via the Supabase MCP but had no
# config block, so a repo-wide `functions deploy` would otherwise default
# them to true. All have JWT-bearing callers, but we pin to avoid any
# behaviour change. ---
  [functions.create-household-booking]
    verify_jwt = false
  [functions.remind-unpaid-bookings]
    verify_jwt = false
  [functions.household-arrival]
    verify_jwt = false
  [functions.partner-program]
    verify_jwt = false
  [functions.attach-referral-code]
    verify_jwt = false
  [functions.admin-cancel-helper-memberships]
    verify_jwt = false
  [functions.update-stripe-webhook-events]
    verify_jwt = false

# --- ✓ Verified €2/month plan (free-to-join model) --------------------------
# Anonymous callers (helpers have no auth session during onboarding); auth is
# enforced inside each function: helper_id scoping + Stripe session metadata
# checks (create/confirm), phone-match (cancel). household-helper-connect-link
# gained a phone-auth branch for the /student-account payout card, so its
# gateway JWT check moves into the function body.
  [functions.create-verified-plan]
    verify_jwt = false
  [functions.confirm-verified-plan]
    verify_jwt = false
  [functions.cancel-verified-plan]
    verify_jwt = false
  [functions.household-helper-connect-link]
    verify_jwt = false

# --- Before/after job photos -------------------------------------------------
# JWT is verified INSIDE the function (must be the booking's assigned helper),
# same model as household-arrival; keep the gateway check off so the pinned
# per-function auth story stays consistent.
  [functions.job-photo]
    verify_jwt = false
