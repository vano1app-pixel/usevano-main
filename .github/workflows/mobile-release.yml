name: Mobile release

# Builds SIGNED store artifacts and (iOS) uploads to TestFlight — so you can ship
# without a Mac. Manual trigger only. Requires the secrets listed below; until
# they're set, run the unsigned "Native build check" workflow instead.
#
# NOTE: signed CI pipelines almost always need one or two tweaks on the first
# run (profile names, Xcode export method, SDK versions). Treat this as a
# working template and check the first run's logs. Full setup: CAPACITOR.md.
#
# ── Required GitHub repo secrets ──────────────────────────────────────────────
# iOS:
#   IOS_DIST_CERT_P12_BASE64       base64 of your Apple Distribution cert (.p12)
#   IOS_DIST_CERT_PASSWORD         password for that .p12
#   IOS_PROVISIONING_PROFILE_BASE64  base64 of the App Store .mobileprovision
#   IOS_PROVISIONING_PROFILE_NAME  the provisioning profile's exact name
#   IOS_TEAM_ID                    your 10-char Apple Team ID
#   ASC_KEY_ID, ASC_ISSUER_ID      App Store Connect API key id + issuer id
#   ASC_API_KEY_P8_BASE64          base64 of the App Store Connect API key (.p8)
# Android:
#   ANDROID_KEYSTORE_BASE64        base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app(s) to build
        type: choice
        options: [both, ios, android]
        default: both

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  ios:
    name: iOS — App Store / TestFlight
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Archive
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM='${{ secrets.IOS_TEAM_ID }}' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER='${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}' \
            archive

      - name: Export .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>com.vanojobs.app</key><string>${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          xcrun altool --upload-app -t ios \
            -f "$RUNNER_TEMP/export/App.ipa" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      - uses: actions/upload-artifact@v4
        with:
          name: VANO-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

  android:
    name: Android — signed AAB
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Write keystore + properties
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload.keystore
          cat > android/keystore.properties <<EOF
          storeFile=app/upload.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Ensure Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null 2>&1 || true

      - name: Build signed AAB
        run: cd android && ./gradlew bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VANO-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
